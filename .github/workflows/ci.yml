name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read configured runtime versions
        id: runtimes
        run: python3 .ai/tools/project-runtimes.py --github-output "$GITHUB_OUTPUT"

      - name: Set up configured Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ steps.runtimes.outputs.python }}

      - name: Set up configured Node.js
        if: ${{ hashFiles('**/package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.runtimes.outputs.node }}

      - name: Set up compatible uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: ${{ steps.runtimes.outputs.uv }}
          enable-cache: true

      - name: Verify exact Python and uv resolutions
        run: python3 .ai/tools/project-runtimes.py --verify python --verify uv

      - name: Verify exact Node.js resolution
        if: ${{ hashFiles('**/package.json') != '' }}
        run: python3 .ai/tools/project-runtimes.py --verify node

      - name: Install orchestration isolation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Assert orchestration isolation support
        run: |
          command -v bwrap
          command -v prlimit
          if ! bwrap --ro-bind / / true; then
            if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            bwrap --ro-bind / / true
          fi

      - name: Verify template or configured project
        run: ./.ai/tools/verify.sh
