[project]
name = "support-knowledge-miner"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25,<26",
    "cryptography>=50,<51",
    "fastapi>=0.116,<1",
    "ijson>=3.5,<4",
    "pgvector>=0.5,<1",
    "psycopg[binary]>=3.2,<4",
    "scikit-learn>=1.9,<2",
    "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
gpu-cu12 = [
    "cuml-cu12>=26.6,<26.7; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]
gpu-cu13 = [
    "cuml-cu13>=26.6,<26.7; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "build==1.5.0",
    "httpx2>=2.7.0",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
]

[tool.uv]
conflicts = [
    [
        { extra = "gpu-cu12" },
        { extra = "gpu-cu13" },
    ],
]

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]

[tool.setuptools.package-data]
"backend.db.migrations" = ["*.sql"]
