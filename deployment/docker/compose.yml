name: support-knowledge-miner

x-vllm-common: &vllm-common
  image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
  environment:
    HF_HOME: /root/.cache/huggingface
  ports:
    - "${VLLM_PORT:-8000}:8000"
  volumes:
    - ksm-vllm-cache:/root/.cache/huggingface
  ipc: host

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_knowledge_miner}
      POSTGRES_USER: ${POSTGRES_USER:-support_knowledge_miner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_knowledge_miner_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ksm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20

  vllm-gpu:
    <<: *vllm-common
    profiles: ["vllm-gpu"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT:-1}
              capabilities: ["gpu"]

  vllm-cpu:
    <<: *vllm-common
    profiles: ["vllm-cpu"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      - --device
      - cpu

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ksm-ollama-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${OLLAMA_GPU_COUNT:-1}
              capabilities: ["gpu"]

volumes:
  ksm-postgres-data:
  ksm-vllm-cache:
  ksm-ollama-data:
